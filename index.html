    <h1>Laulupeole</h1>
    
        <img src="/img/Laulupidu_07072019.jpg" alt="Laulupeo pilt">
    
        <p>Kui põllud sinetavad,<br />
        Sest on rukkilillede aeg<br />
        Ja laulukaar südameid kutsub,<br />
        Siis <span class="hilite">eestlased</span> tulevad,<br />
        See pole mingi vaev,<br />
        Vaid tunne, mis südames tuksub.<br />
        Et koos siis sättida lille<br />
        Ja sammuda tantsutaktis,<br />
        Et koos siis mängida pille<br />
        Ja laulda: "Me elame Eestis!"<br /><br />

        <a href="#">-Moss</a></p>
